# How Shep becomes an app you can launch from Spotlight.
#
# Two identities from one config, chosen by `--config.extraMetadata` at build
# time: **Shep** (day) and **Shep Night** (dev). They are two apps on purpose —
# `appName()` in packages/platform/darwin derives the userData directory, the
# control socket and the Dock name from the same split, so a testing session in
# Night can create and delete tasks without touching the real one's state. v1
# learned that as Shepherd/ShepherdDev; the icons differ (day/night) so a glance
# tells you which one is asking.
appId: com.shepherd.shep
productName: Shep
copyright: MIT

# Workspace packages export TypeScript SOURCE, which a packaged app cannot load
# (Node refuses to strip types under node_modules). This compiles them to JS and
# swaps the linked source for the compiled copy, in the one window where what
# lands in app.asar can still be decided. See the script for why it is not a
# bundler setting.
beforePack: ../../tooling/scripts/before-pack.mjs

# Ad-hoc signs the finished bundle. NOT optional cosmetics: `mac.identity: null`
# below means "do not sign", which leaves Electron's linker-signed stub with an
# unbound Info.plist — and macOS then has no identity to register as a
# notification client, so Shep never appears in System Settings → Notifications
# and every banner is dropped. See the script.
afterPack: ../../tooling/scripts/after-pack-sign.mjs

directories:
  output: release
  buildResources: build

# `out/` is what electron-vite produced; package.json's `main` names
# `out/main/index.js` literally, so both must ship. node_modules is filtered by
# electron-builder itself from the production dependency graph.
files:
  - out/**/*
  - package.json

# node-pty is a native module: it cannot be bundled, so it is unpacked from the
# asar and loaded from disk. Without this the app launches and every session
# fails with a module it cannot find.
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dir
      arch: [arm64]
  # `null` = electron-builder does not sign at all. The ad-hoc signature the app
  # ships with is applied by the `afterPack` hook instead, because this key has
  # no "sign ad-hoc" value and leaving it unsigned costs the app its bundle
  # identity — and with it, notifications. A signed-for-distribution build needs
  # a Developer ID and notarisation, which stays a release concern.
  identity: null
  # The app spawns ptys and reads the user's projects; hardened runtime without
  # the matching entitlements would break both, and it buys nothing unsigned.
  hardenedRuntime: false
