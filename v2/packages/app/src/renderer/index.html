<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shepherd</title>
    <!--
      No remote origins, no inline script, no eval. The renderer loads its own
      bundle and talks to main through the preload bridge; anything else is a
      way for page content to reach the machine.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
