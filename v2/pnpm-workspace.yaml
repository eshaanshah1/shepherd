packages:
  - packages/*
  - packages/platform/*
  - extensions/*

# Which dependencies may run install scripts. pnpm blocks them by default, and
# node-pty's is what makes `spawn-helper` executable.
#
# This list lived in package.json's "pnpm" key until pnpm 10.28 stopped reading
# it — `[WARN] The "pnpm" field in package.json is no longer read by pnpm ...
# keys were ignored: "pnpm.onlyBuiltDependencies"`. The allowlist had become a
# no-op, and it was invisible because node-pty ships prebuilds and the
# `fix-node-pty-perms` postinstall was repairing the permission bit anyway. A
# guard that has silently stopped guarding is worse than no guard.
onlyBuiltDependencies:
  - node-pty
  - electron
  - esbuild

# One place for every version pin. Packages depend on "catalog:" so a bump is a
# one-line edit and two packages can never drift onto different majors.
catalog:
  # toolchain
  typescript: 6.0.3
  vitest: 4.1.10
  eslint: 10.8.0
  typescript-eslint: 8.66.0
  '@types/node': 26.1.2

  # runtime
  node-pty: 1.1.0
  electron: 43.3.0
  electron-vite: 5.0.0
  # electron-vite 5's peer range is vite ^5||^6||^7 — vite 8 is NOT compatible
  # with it yet, so the workspace stays on 7. (That is also why @vitejs/plugin-
  # react is absent: its current major peers on vite ^8. Vite's own esbuild
  # transform reads `jsx: react-jsx` out of tsconfig, so the plugin buys only
  # Fast Refresh, which is not worth a version standoff in M0.)
  vite: 7.3.6

  # renderer (wired in P3; pinned here so the xterm 6 + addon majors are chosen once)
  '@xterm/xterm': 6.0.0
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-webgl': 0.19.0
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

  # the design system (packages/ui)
  #
  # `cva` is the variant plumbing shadcn uses, taken on its own: ~1 kB, no
  # Tailwind in its dependency graph, and it does the one thing a primitive set
  # needs (variant × size × compound → a class string). `clsx`/`tailwind-merge`
  # are deliberately absent — with no Tailwind there is nothing to merge, and
  # `cn` is three lines (design-system spec §1).
  class-variance-authority: 0.7.1
  # Tabler, which Flock already named. Bundled with the primitives rather than
  # after them, because half of them have an icon-shaped hole and a hole filled
  # later is filled twelve different ways (spec §7, answer 3).
  '@tabler/icons-react': 3.46.0
  # Radix, and ONLY where the behaviour is real (design-system spec §3). Three
  # packages, not the umbrella `radix-ui` bundle: taking the whole set would pull
  # in a Select, a Menu and a Tabs that the spec's "deliberately not in v1" list
  # exists to keep out, and a primitive with no consumer is a design nobody has
  # tested.
  #
  #   dialog   focus trap, scrim, Esc, click-out, portal, aria wiring — Modal
  #   tooltip  the delay/dismiss state machine and the collision-aware position
  #   slot     `asChild`, so a Button can BE a link without a second component
  #
  # Notably absent: `react-visually-hidden`. `.sh-ui-sr-only` is four lines of
  # CSS this package needs anyway (StatusDot's paired text), and a dependency for
  # four lines is a dependency whose version you now own.
  '@radix-ui/react-dialog': 1.1.23
  '@radix-ui/react-tooltip': 1.2.16
  '@radix-ui/react-slot': 1.3.3

  # test
  jsdom: 30.0.1
