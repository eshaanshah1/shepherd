name: Shepherd
options:
  bundleIdPrefix: com.shepherd
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  # Vendored (blobless) rather than fetched: a full clone is 3.2G of historical
  # parser.c blobs, paid again per worktree. Run scripts/vendor-codeedit-languages.sh
  # to populate; the tag it checks out is the version pin.
  CodeEditLanguages:
    path: ../../vendor/CodeEditLanguages
  CodeEditSymbols:
    url: https://github.com/CodeEditApp/CodeEditSymbols
    exactVersion: 0.2.3
  TextStory:
    url: https://github.com/ChimeHQ/TextStory
    from: 0.9.0
  TextFormation:
    url: https://github.com/ChimeHQ/TextFormation
    from: 0.8.2
  SwiftCollections:
    url: https://github.com/apple/swift-collections
    majorVersion: 1.0.0
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown
    from: 0.3.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The vendored editor (Sources/Editor) keeps upstream's `package`-access
    # declarations, which need a package name to compile outside SwiftPM.
    SWIFT_PACKAGE_NAME: Shepherd
    HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/Editor/CodeEditTextViewObjC/include
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    OTHER_LDFLAGS: "-lstdc++"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  Shepherd:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shepherd-Bridging.h
    sources:
      - path: Sources
      - path: Resources
      # Ship the Claude Code plugin inside the bundle so an installed app can link
      # it into ~/.claude/skills itself — a DMG user has no checkout to symlink.
      # A folder reference, so hooks/ and .claude-plugin/ are copied verbatim.
      - path: ../../claude-plugin
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../../vendor/GhosttyKit.xcframework
        embed: false
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: CodeEditSymbols
        product: CodeEditSymbols
      - package: TextStory
        product: TextStory
      - package: TextFormation
        product: TextFormation
      - package: SwiftCollections
        product: Collections
      - package: SwiftMarkdown
        product: Markdown
      - target: shepherdd
        copy:
          destination: executables
      - sdk: Carbon.framework
      - sdk: GameController.framework
      - sdk: IOKit.framework
    info:
      path: Shepherd-Info.plist
      properties:
        CFBundleName: Shepherd
        CFBundleDisplayName: Shepherd
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
  # Throwaway dev instance: same sources, distinct bundle id + product name so it runs
  # alongside the daily app with fully separate state (its own UserDefaults domain +
  # ~/.shepherd/dev support subtree). Build/relaunch with scripts/dev.sh. Never shipped —
  # releases build the `Shepherd` target only.
  ShepherdDev:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shepherd-Bridging.h
        PRODUCT_BUNDLE_IDENTIFIER: com.shepherd.Shepherd.dev
        PRODUCT_NAME: ShepherdDev
        # Keep the Swift module name `Shepherd` so `Shepherd.Theme`-style self-qualified
        # references resolve; only the bundle id + product differ from the daily app.
        PRODUCT_MODULE_NAME: Shepherd
    sources:
      - path: Sources
      # Share the daily app's fonts/sounds, but swap the icon for the rouge one in
      # ResourcesDev so the dev app is visually distinct in the Dock + Notifications.
      - path: Resources
        excludes:
          - "Assets.xcassets"
          - "AppIcon.icns"
      - path: ResourcesDev
    dependencies:
      - framework: ../../vendor/GhosttyKit.xcframework
        embed: false
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: CodeEditSymbols
        product: CodeEditSymbols
      - package: TextStory
        product: TextStory
      - package: TextFormation
        product: TextFormation
      - package: SwiftCollections
        product: Collections
      - package: SwiftMarkdown
        product: Markdown
      - target: shepherdd
        copy:
          destination: executables
      - sdk: Carbon.framework
      - sdk: GameController.framework
      - sdk: IOKit.framework
    info:
      path: ShepherdDev-Info.plist
      properties:
        CFBundleName: ShepherdDev
        CFBundleDisplayName: Shepherd Dev
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "0.0.0-dev"
        CFBundleVersion: "1"
  ShepherdModelTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      # `@testable import Shepherd` pulls the app module's interface, which now
      # contains the vendored editor (Sources/Editor) — the test target must be
      # able to resolve the editor's own package dependencies.
      - package: CodeEditLanguages
        product: CodeEditLanguages
      - package: CodeEditSymbols
        product: CodeEditSymbols
      - package: TextStory
        product: TextStory
      - package: TextFormation
        product: TextFormation
      - package: SwiftCollections
        product: Collections
      - package: SwiftMarkdown
        product: Markdown
    sources:
      - path: Sources/SplitTree.swift
      - path: Sources/Tab.swift
      - path: Sources/AgentState.swift
      - path: Sources/FCMMessage.swift
      - path: Sources/Theme.swift
      - path: Sources/Workspace.swift
      - path: Sources/Persistence.swift
      - path: Sources/WorktreeService.swift
      - path: Sources/NewTabRequest.swift
      - path: Sources/AgentLaunch.swift
      - path: Sources/ShepherdConfigWriter.swift
      - path: Sources/WorktreeHookRunner.swift
      - path: Sources/ClaudePluginInstaller.swift
      - path: Sources/WorktreeArchive.swift
      - path: Sources/PRStatus.swift
      - path: Sources/PRComments.swift
      - path: Sources/MarkdownText.swift
      - path: Sources/ShortcutCatalog.swift
      - path: Sources/OnboardingPolicy.swift
      - path: Sources/OnboardingGoal.swift
      - path: Sources/OnboardingPlacement.swift
      - path: Sources/OnboardingAnchorKey.swift
      - path: Sources/OnboardingDemoRepo.swift
      - path: Sources/AppMode.swift
      - path: Sources/SequenceAlign.swift
      - path: Sources/MarkdownInlineDiff.swift
      - path: Sources/MarkdownFrontmatter.swift
      - path: Sources/MarkdownTableDiff.swift
      - path: Sources/SleepPolicy.swift
      - path: Sources/StopPolicy.swift
      - path: Sources/Version.swift
      - path: Sources/IdlePolicy.swift
      - path: Sources/UpdateService.swift
      - path: Sources/UpdateInstaller.swift
      - path: Sources/DiffModel.swift
      - path: Sources/DiffReader.swift
      - path: Sources/Nudges/RepoSignals.swift
      - path: Sources/Nudges/RepoSignalsReader.swift
      - path: Sources/Nudges/NudgeRegistry.swift
      - path: Sources/Nudges/PaneChrome.swift
      - path: Sources/Nudges/PRTemplate.swift
      - path: Sources/Workbench/Diff3.swift
      - path: Sources/Workbench/MergeModel.swift
      - path: Sources/Workbench/ConflictParse.swift
      - path: Sources/Workbench/ConflictReader.swift
      - path: Sources/Workbench/GitStaging.swift
      - path: Sources/Workbench/StitchMap.swift
      - path: Sources/Workbench/BlockMap.swift
      - path: Sources/Workbench/WordDiff.swift
      - path: Sources/Workbench/LockPolicy.swift
      - path: Sources/Workbench/PatchSynth.swift
      - path: Sources/Workbench/StageSelection.swift
      - path: Sources/Workbench/RowPlan.swift
      - path: Sources/Workbench/SideBySidePlan.swift
      - path: Sources/Workbench/EditMap.swift
      - path: Sources/Workbench/CommitHistory.swift
      - path: Sources/Workbench/HighlightVariant.swift
      - path: Sources/Workbench/DocumentProvenance.swift
      - path: Sources/Workbench/BlameParse.swift
      - path: Sources/Workbench/BlameLane.swift
      - path: Sources/Workbench/SequencePolicy.swift
      - path: Sources/Workbench/SequenceRunner.swift
      - path: Sources/Workbench/StashList.swift
      - path: Sources/Workbench/StashRunner.swift
      - path: Sources/Workbench/RefList.swift
      - path: Sources/Workbench/RebasePlan.swift
      - path: Sources/Workbench/RebaseRunner.swift
      - path: Sources/Workbench/FileFinder.swift
      - path: Sources/Workbench/FileLister.swift
      - path: Sources/Workbench/HunkGaps.swift
      - path: Sources/CodeSurfaceState.swift
      - path: Sources/Search.swift
      - path: Sources/NotificationRoutingPolicy.swift
      - path: Sources/RemoteWiring.swift
      - path: Sources/RemoteProtocol.swift
      - path: Sources/PairingPayload.swift
      - path: Sources/TailscaleDiscovery.swift
      - path: Sources/LANIdentity.swift
      - path: Sources/PtyBroker.swift
      - path: Sources/EphemeralPane.swift
      - path: Sources/HandleRegistry.swift
      - path: Sources/TranscriptReader.swift
      - path: Sources/AnsiText.swift
      - path: Sources/Log.swift
      - path: Sources/CLIShim.swift
      - path: Sources/StormDetector.swift
      - path: Tests
  ShepherdRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RemoteTests
      # RemoteServer logs through the free log functions; Log.swift is dependency-free
      # precisely so a test target can compile it without dragging the app in.
      - path: Sources/Log.swift
      - path: Sources/RemoteProtocol.swift
      - path: Sources/RemoteServer.swift
      - path: Sources/LANIdentity.swift
      - path: Sources/LANListener.swift
      - path: Sources/RemoteClient.swift
      - path: Sources/PtyBroker.swift
  shepherdd:
    type: tool
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: shepherdd
        SWIFT_OBJC_BRIDGING_HEADER: Helper/shepherdd-Bridging.h
    sources:
      - path: Helper
      # LANBridge: `attach` to a LAN host must dial TLS and pin the certificate.
      - path: Sources/LANListener.swift
  ShepherdHelperTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: HelperTests/PtyShim.h
    sources:
      - path: HelperTests
      - path: Helper/HelperFrame.swift
      - path: Helper/ControlClient.swift
    dependencies:
      - target: shepherdd
schemes:
  Shepherd:
    build:
      targets:
        Shepherd: all
        ShepherdModelTests: [test]
        ShepherdRemoteTests: [test]
        ShepherdHelperTests: [test]
    test:
      targets:
        - ShepherdModelTests
        - ShepherdRemoteTests
        - ShepherdHelperTests
  ShepherdDev:
    build:
      targets:
        ShepherdDev: all
    run:
      config: Debug
